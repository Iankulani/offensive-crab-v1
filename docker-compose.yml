version: '3.8'

services:
  # Main application (interactive)
  offensive-crab:
    build:
      context: .
      dockerfile: Dockerfile
    image: offensive-crab-v1:latest
    container_name: offensive-crab-v1
    hostname: offensive-crab
    restart: unless-stopped
    
    # Required for network scanning and raw sockets
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
      - SYS_PTRACE
    
    # Use host network for scanning
    network_mode: host
    
    # Environment
    environment:
      - TZ=UTC
      - OFFENSIVE_CRAB_HOME=/app
      - OFFENSIVE_CRAB_CONFIG=/config
      - DOCKER_MODE=true
      - WEB_PORT=5000
      - PYTHONUNBUFFERED=1
    
    # Volumes
    volumes:
      - ./config:/config
      - ./data:/data
      - ./logs:/app/logs
      - ./reports:/app/reports
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    
    # Ports (when not using host network)
    # ports:
    #   - "5000:5000"   # Web dashboard
    #   - "8080:8080"   # Phishing server
    #   - "4444:4444"   # Reverse shell listener
    #   - "5555:5555"   # C2 server
    
    # Interactive mode
    stdin_open: true
    tty: true
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 512M
    
    # Logging
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    
    # Command
    command: python /app/offensive_crab_v1.py

  # Web dashboard only service
  offensive-crab-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: offensive-crab-v1:latest
    container_name: offensive-crab-web
    hostname: offensive-crab-web
    restart: unless-stopped
    
    cap_add:
      - NET_ADMIN
      - NET_RAW
    
    environment:
      - TZ=UTC
      - OFFENSIVE_CRAB_HOME=/app
      - OFFENSIVE_CRAB_CONFIG=/config
      - WEB_PORT=5000
      - PYTHONUNBUFFERED=1
    
    volumes:
      - ./config:/config
      - ./data:/data
    
    ports:
      - "5000:5000"
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    command: web

  # Full standalone with Kali tools
  offensive-crab-full:
    build:
      context: .
      dockerfile: Dockerfile.standalone
    image: offensive-crab-v1:full
    container_name: offensive-crab-full
    hostname: offensive-crab-full
    restart: unless-stopped
    profiles:
      - full
    
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
      - SYS_PTRACE
    
    network_mode: host
    
    environment:
      - TZ=UTC
      - OFFENSIVE_CRAB_HOME=/app
      - OFFENSIVE_CRAB_CONFIG=/config
      - DOCKER_MODE=true
      - PYTHONUNBUFFERED=1
    
    volumes:
      - ./config-full:/config
      - ./data-full:/data
      - ./logs-full:/app/logs
      - ./reports-full:/app/reports
    
    stdin_open: true
    tty: true
    
    healthcheck:
      test: ["CMD", "python3", "/app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 8G
    
    command: python3 /app/offensive_crab_v1.py

  # Database (optional PostgreSQL for scaling)
  postgres:
    image: postgres:15-alpine
    container_name: offensive-crab-db
    restart: unless-stopped
    profiles:
      - with-db
    
    environment:
      - POSTGRES_USER=crab
      - POSTGRES_PASSWORD=crab_secure_password_2024
      - POSTGRES_DB=offensive_crab
      - PGDATA=/var/lib/postgresql/data/pgdata
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    ports:
      - "5432:5432"
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crab -d offensive_crab"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: offensive-crab-redis
    restart: unless-stopped
    profiles:
      - with-db
    
    command: redis-server --appendonly yes --requirepass crab_redis_password_2024
    
    volumes:
      - redis_data:/data
    
    ports:
      - "6379:6379"
    
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "crab_redis_password_2024", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: offensive-crab-nginx
    restart: unless-stopped
    profiles:
      - with-proxy
    
    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./static:/usr/share/nginx/html:ro
    
    depends_on:
      - offensive-crab-web
    
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

# Volumes
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  config:
    driver: local
  data:
    driver: local

# Networks
networks:
  default:
    name: offensive-crab-network
    driver: bridge
